[package]
name = "sound-place"
version = "0.1.0"
description = "SoundPlace - 游戏声音方位分析学习工具"
authors = ["you"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "sound_place_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 阶段 2-3 启用：
# wasapi = "2"
# windows-sys = { version = "0.52", features = ["Win32_Media_Audio", "Win32_System_Com"] }
# realfft = "3"
# heapless = "0.8"
# toml = "0.8"
# directories = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
